<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TUK 외박신청</title>
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif; }
      body { box-sizing: border-box; margin: 0; padding: 18px; width: 340px; color: #17213a; background: #f7f8fb; }
      h1 { margin: 0 0 6px; font-size: 21px; }
      .hint { margin: 0 0 16px; color: #667085; font-size: 12px; line-height: 1.5; }
      label { display: block; margin: 11px 0 5px; font-size: 13px; font-weight: 700; }
      input { box-sizing: border-box; width: 100%; padding: 10px; border: 1px solid #cbd2e1; border-radius: 9px; background: white; font: inherit; }
      .actions { display: grid; grid-template-columns: 1fr 1.35fr; gap: 8px; margin-top: 16px; }
      button { padding: 10px 8px; border: 0; border-radius: 9px; font: inherit; font-weight: 700; cursor: pointer; }
      button:disabled { cursor: wait; opacity: .55; }
      #check { color: #35405a; background: #e7eaf1; }
      #submit { color: white; background: #3157d5; }
      #status { min-height: 38px; margin: 14px 0 0; padding: 10px; border-radius: 9px; background: white; font-size: 13px; line-height: 1.45; white-space: pre-wrap; }
      #status[data-kind="success"] { color: #0c6b3d; background: #e9f8ef; }
      #status[data-kind="error"] { color: #a12626; background: #fff0f0; }
      a { color: #3157d5; }
    </style>
  </head>
  <body>
    <h1>외박신청</h1>
    <p class="hint">통합정보시스템의 외박신청 화면에 로그인한 뒤 사용하세요. 비밀번호는 확장 프로그램이 받거나 저장하지 않습니다.</p>
    <form id="form">
      <label for="start">시작일</label>
      <input id="start" type="date" required />
      <label for="end">종료일 <span class="hint">(비우면 시작일과 같음)</span></label>
      <input id="end" type="date" />
      <div class="actions">
        <button id="check" type="button">가능 여부 확인</button>
        <button id="submit" type="submit">신청하기</button>
      </div>
    </form>
    <div id="status" role="status" aria-live="polite">날짜를 선택하세요.</div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
