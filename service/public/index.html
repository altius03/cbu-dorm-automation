<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>씨부엉 외박신청</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif;
        color: var(--ink);
        background: var(--page);
        --page: #fff;
        --surface: #fff;
        --field: #fff;
        --ink: #182230;
        --text: #344054;
        --brand: #8b7343;
        --saturday: #335dcc;
        --blue: #335cff;
        --blue-dark: #2346cf;
        --blue-line: #dbe3ff;
        --blue-soft: #f2f5ff;
        --blue-soft-strong: #edf2ff;
        --blue-text: #2947aa;
        --line: #dfe4ec;
        --input-line: #cbd2dd;
        --selected-line: #7891f8;
        --muted: #667085;
        --past: #98a2b3;
        --soft: #f7f8fa;
        --soft-strong: #edf0f4;
        --hover: #f0f3ff;
        --focus: rgba(51, 92, 255, .2);
        --green: #14804a;
        --green-line: #bce8ce;
        --green-soft: #effaf3;
        --green-text: #086a3c;
        --amber: #a15c00;
        --amber-soft: #fff6df;
        --red: #b42318;
        --red-line: #ffd0cc;
        --red-soft: #fff3f2;
        --red-soft-strong: #fff0ef;
        --red-text: #a1261c;
        --shadow: rgba(31, 42, 68, .07);
        --shadow-strong: rgba(31, 42, 68, .14);
        --submit-bar: rgba(255, 255, 255, .96);
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --page: #08090b;
        --surface: #141518;
        --field: #0e0f12;
        --ink: #f8fafc;
        --text: #d5d9e0;
        --brand: #cdb477;
        --saturday: #82a6ff;
        --blue: #3f68f5;
        --blue-dark: #3156d8;
        --blue-line: #315fc2;
        --blue-soft: #151b28;
        --blue-soft-strong: #181f2e;
        --blue-text: #b8c8ff;
        --line: #30333a;
        --input-line: #59616d;
        --selected-line: #668cff;
        --muted: #a0a6b0;
        --past: #717780;
        --soft: #1b1d21;
        --soft-strong: #23262b;
        --hover: #20242b;
        --focus: rgba(102, 140, 255, .48);
        --green: #67d79b;
        --green-line: #285f43;
        --green-soft: #142a20;
        --green-text: #83e4ad;
        --amber: #ffc266;
        --amber-soft: #392a13;
        --red: #ff9188;
        --red-line: #67343a;
        --red-soft: #331d20;
        --red-soft-strong: #391c20;
        --red-text: #ffaaa2;
        --shadow: rgba(0, 0, 0, .42);
        --shadow-strong: rgba(0, 0, 0, .62);
        --submit-bar: rgba(8, 9, 11, .96);
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; min-height: 100vh; background: var(--page); }
      button, input { font: inherit; }
      button { cursor: pointer; }
      button:disabled { cursor: not-allowed; opacity: .5; }
      [hidden] { display: none !important; }
      .login-shell { width: min(440px, calc(100% - 32px)); margin: 0 auto; padding: 10vh 0 48px; }
      .login-card, .panel { border: 1px solid var(--line); border-radius: 20px; background: var(--surface); box-shadow: 0 10px 32px var(--shadow); }
      .login-card { padding: 32px; }
      .login-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
      .club-mark { width: 72px; height: 48px; object-fit: contain; flex: none; }
      .login-brand strong { font-size: 32px; font-weight: 600; letter-spacing: -.04em; }
      .login-brand small { margin-left: 5px; color: var(--brand); font-size: 16px; font-weight: 600; }
      .brand { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 20px; color: var(--blue); font-size: 13px; font-weight: 600; letter-spacing: .04em; }
      h1, h2, p { margin-top: 0; }
      h1 { margin-bottom: 9px; font-size: clamp(25px, 5vw, 32px); font-weight: 600; letter-spacing: -.04em; }
      h2 { margin-bottom: 4px; font-size: 21px; font-weight: 600; letter-spacing: -.02em; }
      p { color: var(--muted); line-height: 1.55; }
      .field { display: grid; gap: 7px; margin-top: 18px; }
      .field label, legend { font-size: 14px; font-weight: 600; }
      .field input { width: 100%; min-height: 48px; padding: 0 14px; border: 1px solid var(--input-line); border-radius: 11px; color: var(--ink); background: var(--field); }
      .password-input { position: relative; }
      .password-input input { padding-right: 48px; }
      .password-toggle { position: absolute; top: 50%; right: 5px; display: grid; width: 38px; height: 38px; padding: 0; border: 0; place-items: center; transform: translateY(-50%); color: var(--muted); background: transparent; }
      .password-toggle svg { width: 21px; height: 21px; }
      .password-toggle[aria-pressed="false"] .password-slash { display: none; }
      .field input:focus, button:focus-visible, summary:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
      .primary, .secondary, .ghost, .danger { min-height: 44px; padding: 0 16px; border: 0; border-radius: 11px; font-weight: 600; }
      .primary { color: white; background: var(--blue); }
      .primary:hover { background: var(--blue-dark); }
      .secondary { color: var(--text); background: var(--soft-strong); }
      .ghost { color: var(--muted); background: transparent; }
      .danger { color: var(--red); background: var(--red-soft-strong); }
      .login-card .primary { width: 100%; margin-top: 22px; }
      #login-status { margin: 16px 0 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
      #login-status:empty { display: none; }
      #login-status[data-kind="error"] { color: var(--red); }
      .login-footer { display: flex; align-items: center; gap: 10px; margin-top: 16px; }
      .club-link { display: flex; align-items: center; gap: 9px; margin-top: 16px; padding: 10px 2px; color: var(--text); font-size: 12px; font-weight: 600; text-decoration: none; }
      .login-footer .club-link { min-width: 0; margin: 0; flex: 1; }
      .club-link svg { width: 19px; height: 19px; color: #c13584; flex: none; }
      .club-link:hover { color: var(--ink); }
      .external-arrow { margin-left: 2px; font-size: 13px; }
      .theme-toggle { display: grid; width: 42px; height: 42px; padding: 0; border: 1px solid var(--line); border-radius: 11px; place-items: center; color: var(--text); background: var(--soft); font-size: 20px; line-height: 1; flex: none; }
      .theme-toggle:hover { background: var(--soft); }
      .app-shell { width: min(1080px, calc(100% - 32px)); margin: 0 auto; padding: 26px 0 60px; }
      .app-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
      .header-actions { display: flex; align-items: center; gap: 8px; }
      .app-header .brand { margin: 0; color: var(--ink); font-size: 22px; letter-spacing: -.02em; }
      .app-header .brand span { white-space: nowrap; }
      .app-header .club-mark { width: 72px; height: 48px; }
      .app-header .brand small { margin-left: 4px; color: var(--brand); font-size: 13px; letter-spacing: 0; }
      .account-menu { position: relative; }
      .account-menu summary { padding: 10px 13px; border-radius: 10px; color: var(--text); background: var(--soft); font-weight: 600; white-space: nowrap; list-style: none; cursor: pointer; }
      .account-menu summary::-webkit-details-marker { display: none; }
      .account-popover { position: absolute; z-index: 20; top: 48px; right: 0; display: grid; width: 190px; gap: 6px; padding: 9px; border: 1px solid var(--line); border-radius: 13px; background: var(--surface); box-shadow: 0 12px 30px var(--shadow-strong); }
      .account-popover button { width: 100%; }
      #status { margin-bottom: 16px; padding: 12px 14px; border: 1px solid var(--blue-line); border-radius: 12px; color: var(--blue-text); background: var(--blue-soft); line-height: 1.45; }
      #status:empty { display: none; }
      #status[data-kind="success"] { border-color: var(--green-line); color: var(--green-text); background: var(--green-soft); }
      #status[data-kind="error"] { border-color: var(--red-line); color: var(--red-text); background: var(--red-soft); }
      #service-dialog { width: min(400px, calc(100% - 32px)); padding: 0; border: 0; border-radius: 18px; color: var(--ink); background: var(--surface); box-shadow: 0 24px 64px var(--shadow-strong); }
      #service-dialog::backdrop { background: rgba(24, 34, 48, .45); backdrop-filter: blur(2px); }
      .dialog-card { margin: 0; padding: 26px; background: var(--surface); }
      .dialog-mark { display: grid; width: 40px; height: 40px; margin-bottom: 16px; place-items: center; border-radius: 50%; font-size: 22px; font-weight: 600; }
      #service-dialog[data-kind="success"] .dialog-mark { color: var(--green); background: var(--green-soft); }
      #service-dialog[data-kind="warning"] .dialog-mark, #service-dialog[data-kind="danger"] .dialog-mark { color: var(--red); background: var(--red-soft-strong); }
      .dialog-card h2 { margin: 0; font-size: 21px; }
      .dialog-message { margin: 9px 0 0; color: var(--muted); white-space: pre-line; }
      .dialog-support { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; padding: 9px 10px; border-radius: 10px; color: var(--muted); background: var(--soft); font-size: 12px; }
      .dialog-support code { color: var(--ink); font-weight: 600; }
      .dialog-support button { min-height: 32px; padding: 0 8px; }
      .dialog-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 24px; }
      .dialog-actions:has(#dialog-cancel[hidden]) { grid-template-columns: 1fr; }
      .dialog-actions:has(#dialog-confirm[hidden]) { display: none; }
      .dialog-actions button { width: 100%; }
      #service-dialog[data-kind="danger"] #dialog-confirm { color: white; background: var(--red); }
      .workspace { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(300px, .8fr); gap: 18px; align-items: start; }
      .calendar-column { display: grid; gap: 18px; align-content: start; }
      .panel { padding: 22px; }
      .club-panel { padding: 0 22px; }
      .club-panel .club-link { min-height: 44px; margin: 0; padding: 0; gap: 10px; font-size: 17px; }
      .club-panel .club-link svg { width: 24px; height: 24px; }
      .panel-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
      .calendar-toolbar { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px; }
      .calendar-toolbar button { width: 44px; height: 44px; border: 0; border-radius: 11px; color: var(--text); background: var(--soft); font-size: 22px; }
      #month-title { margin: 0; text-align: center; font-size: 20px; }
      .weekday-row, #calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
      .weekday-row { margin: 18px 0 8px; color: var(--muted); font-size: 12px; font-weight: 500; text-align: center; }
      .weekday-row span:first-child { color: var(--red); }
      .weekday-row span:last-child { color: var(--saturday); }
      .day { position: relative; min-width: 0; aspect-ratio: 1; border: 1px solid transparent; border-radius: 12px; color: var(--text); background: transparent; font-weight: 500; }
      .day:disabled { opacity: 1; }
      .day:hover:not(:disabled) { background: var(--hover); }
      .day.is-today { display: flex; flex-direction: column; align-items: center; justify-content: center; border-color: var(--selected-line); line-height: 1.1; }
      .day .today-label { margin-top: 6px; color: var(--blue-text); font-size: 16px; font-weight: 500; }
      .day.is-today.is-selected .today-label { color: white; }
      .day.is-today::after { right: auto; left: 3px; }
      .day.is-selected { color: white; background: var(--blue); }
      .day.is-selected:disabled { opacity: 1; }
      .day.is-past, .day.is-unavailable { color: var(--past); }
      .day.is-holiday:not(.is-selected) { color: var(--red); }
      .day.is-holiday::before { position: absolute; top: 4px; right: 5px; content: "휴"; color: var(--red); font-size: 16px; font-weight: 500; }
      .day.is-holiday.is-selected::before { color: white; }
      .day.has-application { box-shadow: inset 0 0 0 2px #4f78ff; }
      .day.status-saved { box-shadow: inset 0 0 0 2px #1b9a5a; background: var(--green-soft); color: var(--green-text); }
      .day.status-exists { box-shadow: inset 0 0 0 2px #4f78ff; background: var(--blue-soft-strong); color: var(--blue-text); }
      .day.status-overlap, .day.status-not_attempted { background: var(--soft-strong); color: var(--muted); }
      .day.status-unknown { box-shadow: inset 0 0 0 2px #e09a29; background: var(--amber-soft); color: var(--amber); }
      .day.is-selected.status-saved, .day.is-selected.status-exists, .day.is-selected.status-overlap,
      .day.is-selected.status-not_attempted, .day.is-selected.status-unknown { color: white; background: var(--blue); }
      .day::after { position: absolute; right: 6px; bottom: 4px; content: attr(data-mark); font-size: 11px; font-weight: 600; }
      .calendar-legend { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 16px; color: var(--muted); font-size: 12px; }
      .calendar-legend span { display: inline-flex; align-items: center; gap: 5px; }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: #98a2b3; }
      .dot.selected { background: var(--blue); }
      .dot.saved { background: #1b9a5a; }
      .dot.portal { border: 2px solid #4f78ff; background: var(--surface); }
      .dot.check { background: #e09a29; }
      .dot.holiday { background: var(--red); }
      #holiday-meta { margin: 12px 2px 0; color: var(--red); font-size: 12px; line-height: 1.5; }
      fieldset { min-width: 0; margin: 0; padding: 0; border: 0; }
      legend { margin-bottom: 10px; }
      .mode-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-bottom: 22px; padding: 4px; border-radius: 12px; background: var(--soft-strong); }
      .mode-tabs label { position: relative; }
      .mode-tabs input { position: absolute; opacity: 0; }
      .mode-tabs span { display: grid; min-height: 42px; place-items: center; border-radius: 9px; color: var(--muted); font-size: 14px; font-weight: 600; cursor: pointer; }
      .mode-tabs input:checked + span { color: var(--ink); background: var(--field); box-shadow: 0 2px 8px var(--shadow); }
      .control-copy { margin-bottom: 18px; font-size: 13px; }
      .choice-list { display: grid; gap: 8px; }
      .choice { position: relative; display: flex; gap: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; cursor: pointer; }
      .choice:has(input:checked) { border-color: var(--selected-line); background: var(--blue-soft); }
      .choice:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
      .choice input { margin-top: 2px; accent-color: var(--blue); }
      .pattern-options .choice input { appearance: none; width: 16px; height: 16px; flex: none; border: 2px solid var(--input-line); border-radius: 50%; background: transparent; }
      .pattern-options .choice input:checked { border-color: var(--blue); background: radial-gradient(circle, var(--blue) 0 4px, transparent 4px); }
      .pattern-options .choice small { display: none; }
      .choice strong, .choice small { display: block; }
      .choice strong { font-weight: 500; }
      .choice small { margin-top: 3px; color: var(--muted); }
      .options-section + .options-section { margin-top: 20px; }
      #custom-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 10px; }
      #custom-weekdays label { position: relative; }
      #custom-weekdays input { position: absolute; opacity: 0; }
      #custom-weekdays span { display: grid; min-height: 38px; place-items: center; border: 1px solid var(--line); border-radius: 9px; color: var(--muted); font-size: 12px; font-weight: 500; cursor: pointer; }
      #custom-weekdays input:checked + span { border-color: var(--blue); color: var(--blue); background: var(--blue-soft); }
      .selection-summary { margin: 20px 0 12px; padding: 13px; border-radius: 12px; color: var(--text); background: var(--soft); font-size: 14px; font-weight: 500; }
      #submit-selection { width: 100%; }
      #cancel-job { width: 100%; margin-top: 9px; }
      #refresh-data { white-space: nowrap; }
      .panel-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
      @media (max-width: 760px) {
        .app-shell { width: 100%; padding: 18px 14px 110px; }
        .app-header .brand { font-size: 20px; }
        .app-header .club-mark { width: 66px; height: 44px; }
        .app-header .brand small { font-size: 12px; }
        .workspace { grid-template-columns: 1fr; }
        .calendar-column { display: contents; }
        .panel { padding: 18px 14px; border-radius: 16px; }
        .control-panel { order: 1; }
        .calendar-panel { order: 2; }
        .club-panel { order: 3; padding: 0 14px; }
        .club-panel .club-link { font-size: 15px; }
        .club-panel .club-link svg { width: 21px; height: 21px; }
        .pattern-options { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .pattern-options .featured-pattern { grid-column: 1 / -1; }
        .pattern-options .choice, .range-options .choice { min-height: 44px; align-items: center; justify-content: center; gap: 0; padding: 0 8px; text-align: center; }
        .pattern-options .choice { min-height: 48px; justify-content: flex-start; gap: 8px; padding: 8px; text-align: left; }
        .pattern-options .choice input { margin: 0; }
        .range-options .choice input { position: absolute; opacity: 0; }
        .range-options .choice small { display: none; }
        .pattern-options .featured-pattern { min-height: 56px; padding: 8px 12px; }
        .range-options { grid-template-columns: repeat(3, 1fr); gap: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 11px; }
        .range-options .choice { border: 0; border-right: 1px solid var(--line); border-radius: 0; }
        .range-options .choice:last-child { border-right: 0; }
        .range-options .choice:has(input:checked) { color: white; background: var(--blue); }
        .day { min-height: 42px; border-radius: 10px; }
        .day .today-label, .day.is-holiday::before { font-size: 10px; }
        .submit-bar { position: fixed; z-index: 15; right: 0; bottom: 0; left: 0; padding: 10px 14px max(10px, env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--submit-bar); backdrop-filter: blur(12px); }
        #submit-selection { max-width: 520px; margin: 0 auto; display: block; }
        #cancel-job { max-width: 520px; margin: 8px auto 0; display: block; }
      }
      @media (max-width: 480px) {
        .login-shell { width: 100%; padding: 0; }
        .login-card { min-height: 100vh; padding: 42px 20px; border: 0; border-radius: 0; box-shadow: none; }
        .day { min-height: 38px; font-size: 13px; }
        .weekday-row, #calendar-grid { gap: 3px; }
      }
      @media (max-width: 360px) {
        .app-header .brand { gap: 6px; font-size: 18px; }
        .app-header .club-mark { width: 58px; height: 39px; }
        .app-header .brand small { font-size: 10px; }
        .header-actions { gap: 6px; }
        .account-menu summary { padding: 10px; }
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) { color-scheme: dark; background: #08090b; }
        :root:not([data-theme="light"]) body { background: #08090b; }
      }
    </style>
  </head>
  <body>
    <main>
      <section id="login-section" class="login-shell" hidden>
        <div class="login-card">
          <div class="login-brand">
            <img class="club-mark" src="/assets/cbu-sleeping-owl-v2.png" alt="" />
            <div><strong>외박신청</strong><small>by CBU</small></div>
          </div>
          <h1>외박신청을 더 간편하게</h1>
          <form id="login-form">
            <div class="field">
              <label for="student-id">포탈 아이디</label>
              <input id="student-id" name="studentId" autocomplete="username" maxlength="32" required />
            </div>
            <div class="field">
              <label for="password">포탈 비밀번호</label>
              <div class="password-input">
                <input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required />
                <button id="password-toggle" class="password-toggle" type="button" aria-label="비밀번호 보기" aria-pressed="false">
                  <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" />
                    <circle cx="12" cy="12" r="2.5" />
                    <path class="password-slash" d="m4 4 16 16" />
                  </svg>
                </button>
              </div>
            </div>
            <button class="primary" type="submit">로그인하고 시작하기</button>
          </form>
          <div id="login-status" role="status" aria-live="polite"></div>
          <div class="login-footer">
            <a class="club-link" href="https://www.instagram.com/tukorea_cbu/" target="_blank" rel="noopener noreferrer" aria-label="한국공학대 개발동아리 CBU 인스타그램">
              <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="5" />
                <circle cx="12" cy="12" r="4" />
                <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none" />
              </svg>
              <span>한국공학대 개발동아리 CBU <span class="external-arrow" aria-hidden="true">↗</span></span>
            </a>
            <button class="theme-toggle" data-theme-toggle type="button" aria-label="다크 모드로 전환" aria-pressed="false" title="다크 모드로 전환">☾</button>
          </div>
        </div>
      </section>

      <section id="app-section" class="app-shell" hidden>
        <header class="app-header">
          <div class="brand"><img class="club-mark" src="/assets/cbu-sleeping-owl-v2.png" alt="" /><span>외박신청<small>by CBU</small></span></div>
          <div class="header-actions">
            <button class="theme-toggle" data-theme-toggle type="button" aria-label="다크 모드로 전환" aria-pressed="false" title="다크 모드로 전환">☾</button>
            <details class="account-menu">
              <summary>더보기</summary>
              <div class="account-popover">
                <button id="logout" class="secondary" type="button">로그아웃</button>
                <button id="delete-account" class="danger" type="button">서비스 기록 삭제</button>
              </div>
            </details>
          </div>
        </header>

        <div id="status" role="status" aria-live="polite">로그인 상태를 확인하고 있습니다…</div>

        <div class="workspace">
          <div class="calendar-column">
            <section class="panel calendar-panel" aria-labelledby="calendar-heading">
            <div class="panel-heading">
              <h2 id="calendar-heading">날짜 선택</h2>
              <div class="panel-actions">
                <button id="reconcile-job" class="secondary" type="button" hidden>결과 다시 확인</button>
                <button id="refresh-data" class="ghost" type="button">새로고침</button>
                <button id="today-month" class="ghost" type="button">오늘</button>
              </div>
            </div>
            <div class="calendar-toolbar">
              <button id="prev-month" type="button" aria-label="이전 달">‹</button>
              <h2 id="month-title" aria-live="polite"></h2>
              <button id="next-month" type="button" aria-label="다음 달">›</button>
            </div>
            <div class="weekday-row" aria-hidden="true">
              <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
            </div>
            <div id="calendar-grid" role="grid" aria-label="외박 날짜 달력"></div>
            <div class="calendar-legend" aria-label="달력 표시 설명">
              <span><i class="dot selected"></i>선택한 날</span>
              <span><i class="dot portal"></i>이미 신청한 날</span>
              <span><i class="dot holiday"></i>공휴일</span>
              <span data-result="saved" hidden><i class="dot saved"></i>완료</span>
              <span data-result="unknown" hidden><i class="dot check"></i>확인 필요</span>
              <span data-result="exists overlap not_attempted" hidden><i class="dot"></i>제외 및 미처리</span>
            </div>
            <p id="holiday-meta" hidden></p>
            </section>

            <aside class="club-panel" aria-label="CBU 인스타그램">
              <a class="club-link" href="https://www.instagram.com/tukorea_cbu/" target="_blank" rel="noopener noreferrer" aria-label="한국공학대 개발동아리 CBU 인스타그램">
                <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="3" width="18" height="18" rx="5" />
                  <circle cx="12" cy="12" r="4" />
                  <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none" />
                </svg>
                <span>한국공학대 개발동아리 CBU <span class="external-arrow" aria-hidden="true">↗</span></span>
              </a>
            </aside>
          </div>

          <section class="panel control-panel" aria-labelledby="request-heading">
              <h2 id="request-heading">외박 날짜 선택</h2>
              <form id="request-form">
              <div class="mode-tabs" role="group" aria-label="날짜 선택 방식">
                <label><input id="mode-auto" type="radio" name="mode" value="auto" checked /><span>자동 선택</span></label>
                <label><input id="mode-manual" type="radio" name="mode" value="manual" /><span>달력 직접 선택</span></label>
              </div>

              <section id="manual-controls" hidden>
                <p class="control-copy">외박할 날짜를 선택하세요.</p>
              </section>

              <section id="auto-controls">
                <fieldset class="options-section">
                  <legend>신청할 날</legend>
                  <div class="choice-list pattern-options">
                    <label class="choice"><input type="checkbox" name="pattern" value="daily" /><span><strong>매일</strong><small>기간 내 모든 날</small></span></label>
                    <label class="choice"><input type="checkbox" name="pattern" value="weekdays" /><span><strong>평일</strong><small>공휴일 제외 월~금</small></span></label>
                    <label class="choice"><input type="checkbox" name="pattern" value="custom" /><span><strong>요일 지정</strong><small>원하는 요일 반복</small></span></label>
                    <label class="choice"><input type="checkbox" name="pattern" value="holidays" aria-label="이번 달 공휴일과 전날" /><span><strong>공휴일</strong><small>공휴일과 전날</small></span></label>
                    <label class="choice featured-pattern"><input type="checkbox" name="pattern" value="weekends" aria-label="주말, 금요일부터 일요일까지" /><span><strong>주말</strong><small>금~일 반복</small></span></label>
                  </div>
                  <div id="custom-weekdays" hidden>
                    <label><input type="checkbox" name="weekday" value="0" /><span>일</span></label>
                    <label><input type="checkbox" name="weekday" value="1" /><span>월</span></label>
                    <label><input type="checkbox" name="weekday" value="2" /><span>화</span></label>
                    <label><input type="checkbox" name="weekday" value="3" /><span>수</span></label>
                    <label><input type="checkbox" name="weekday" value="4" /><span>목</span></label>
                    <label><input type="checkbox" name="weekday" value="5" /><span>금</span></label>
                    <label><input type="checkbox" name="weekday" value="6" /><span>토</span></label>
                  </div>
                </fieldset>

                <fieldset id="range-section" class="options-section">
                  <legend>반복 기간</legend>
                  <div id="horizon-options" class="choice-list range-options">
                    <label class="choice"><input type="radio" name="range" value="7" /><span><strong>1주</strong><small>오늘 포함 7일</small></span></label>
                    <label class="choice"><input type="radio" name="range" value="14" /><span><strong>2주</strong><small>오늘 포함 14일</small></span></label>
                    <label class="choice"><input type="radio" name="range" value="31" /><span><strong>1달</strong><small>한 달 단위 최대 기간</small></span></label>
                  </div>
                </fieldset>
              </section>

              <div id="selection-summary" class="selection-summary">아직 선택한 날짜가 없습니다.</div>
              <div class="submit-bar">
                <button id="submit-selection" class="primary" type="submit" disabled>날짜를 선택해 주세요</button>
                <button id="cancel-job" class="danger" type="button" hidden>남은 신청 중단</button>
              </div>
              </form>
          </section>
        </div>

      </section>

      <dialog id="service-dialog" aria-labelledby="dialog-title" aria-describedby="dialog-message">
        <form class="dialog-card" method="dialog">
          <div id="dialog-mark" class="dialog-mark" aria-hidden="true" hidden></div>
          <h2 id="dialog-title"></h2>
          <p id="dialog-message" class="dialog-message"></p>
          <div id="dialog-support" class="dialog-support" hidden>
            <span>문의 코드 <code id="dialog-code"></code></span>
            <button id="dialog-copy" class="ghost" type="button">복사</button>
          </div>
          <div class="dialog-actions">
            <button id="dialog-cancel" class="secondary" type="submit" value="cancel">취소</button>
            <button id="dialog-confirm" class="primary" type="submit" value="confirm">확인</button>
          </div>
        </form>
      </dialog>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
